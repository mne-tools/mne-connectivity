[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools_scm[toml]>=8", "wheel"]

[dependency-groups]
# Dependencies for building the package
build = ["build", "twine"]
dev = [
  "pyside6 >= 6.11.1",
  { include-group = "build" },
  { include-group = "doc" },
  { include-group = "style" },
  { include-group = "test" },
]
# Dependencies for building the documentation
doc = [
  "intersphinx-registry",
  "joblib",  # for sphinx_gallery_conf["parallel"]
  "memory-profiler",
  "mne-bids",
  "nibabel >= 5.2",  # released 2023-12-11, will become 5.3 on 2026-10-08
  "nilearn >= 0.10",  # released 2023-01-06, will become 0.11 on 2026-12-02
  "numpydoc",
  "pooch",
  "pydata-sphinx-theme >= 0.14.1",
  "PyQt6",
  "sphinx != 8.1.0",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-gallery >= 0.18.0",
  "sphinx-issues",
  "sphinx_autodoc_typehints",
  "sphinxcontrib-bibtex",
  "sphinxcontrib-towncrier",
  "threadpoolctl",
]
# Dependencies for code style checks and formatting
style = [
  "codespell",
  "isort",
  "pre-commit",
  "pydocstyle",
  "pydocstyle[toml]",
  "rstcheck",
  "ruff",
  "toml-sort",
  "yamllint",
]
# Dependencies for running tests
test = [
  "h5netcdf",
  "joblib",
  "mne-bids",
  "pymatreader",
  "pytest != 9.1.0, != 9.1.1",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "pyvista",
  "pyvistaqt",
  "statsmodels",
  "threadpoolctl",
]

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]
dependencies = [
  "matplotlib >= 3.9",  # released 2024-05-15, will become 3.10 on 2026-12-14
  "mne >= 1.8",
  "netCDF4 >= 1.6.5",
  "numpy >= 2.1",  # released 2024-08-18, will become 2.2 on 2026-12-08
  "pandas >= 2.2",  # released 2024-01-20, will become 2.3 on 2027-06-05
  "scikit-learn >= 1.5",  # released 2024-05-21, will become 1.6 on 2026-12-09
  "scipy >= 1.14",  # released 2024-06-24, will become 1.15 on 2027-01-03
  "tqdm",
  "xarray >= 2023.11.0",
]
description = "mne-connectivity: A module for connectivity data analysis with MNE."
dynamic = ["version"]
keywords = ["connectivity", "eeg", "ieeg", "meg", "neuroscience"]
license = { file = "LICENSE" }
maintainers = [{ email = "adam.li@columbia.edu", name = "Adam Li" }]
name = "mne-connectivity"
readme = { content-type = "text/x-rst", file = "README.rst" }
requires-python = ">=3.11"

[project.optional-dependencies]
full = [
  "mne-connectivity[full-no-qt]",
  "PySide6 != 6.7.0, != 6.8.0, != 6.8.0.1, != 6.9.1",
]
# Dependencies for full MNE-Connectivity functionality
# We first define a variant without any Qt bindings. The "complete" variant,
# mne-connectivity[full], makes an opinionated choice and installs PySide6.
# We also offer mne-connectivity[full-pyqt6], which will install PyQt6 instead of
# PySide6.
full-no-qt = [
  "h5io >= 0.2.4",
  "h5netcdf",
  "joblib",
  "mne-qt-browser >= 0.6",  # released 2023-10-11, will become 0.7 on 2027-04-08
  "numba",
  "pyvista >= 0.44",  # released 2024-07-07, will become 0.45 on 2027-04-19
  "pyvistaqt >= 0.11",  # released 2023-06-30, will become 0.12 on 2028-07-01
  "qtpy",
  "sip",
  "vtk",
]
full-pyqt6 = [
  "mne-connectivity[full-no-qt]",
  "PyQt6 != 6.6.0",
  "PyQt6-Qt6 != 6.6.0, != 6.7.0",
]
full-pyside6 = ["mne-connectivity[full]"]

[project.urls]
documentation = "https://mne.tools/mne-connectivity"
source = "https://github.com/mne-tools/mne-connectivity"
tracker = "https://github.com/mne-tools/mne-connectivity/issues"

[tool.changelog-bot]

[tool.changelog-bot.towncrier_changelog]
changelog_skip_label = "no-changelog-entry-needed"
enabled = true
verify_pr_number = true

[tool.codespell]
builtin = "clear,rare,informal,names,usage"
ignore-words = ".codespellignore"
skip = "doc/references.bib"

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
precision = 2

[tool.coverage.run]
branch = true
cover_pylib = false
omit = ["**/__init__.py", "**/mne_connectivity/conftest.py", "**/tests/**"]

[tool.isort]
extend_skip_glob = ["doc/*", "examples/*", "setup.py"]
line_length = 88
multi_line_output = 3
py_version = 314

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true

[tool.pydocstyle]
add_ignore = "D100,D104,D107"
convention = "numpy"
ignore-decorators = "(copy_doc|property|.*setter|.*getter|pyqtSlot|Slot)"
match = '^(?!setup|__init__|test_).*\.py'
match-dir = "^mne_connectivity.*"

[tool.pytest.ini_options]
addopts = "--durations 20 --junit-xml=junit-results.xml -v -rfEXs --tb=short --color=yes"
junit_family = "xunit2"
minversion = "6.0"

[tool.rstcheck]
ignore_directives = [
  "autoclass",
  "autofunction",
  "automodule",
  "autosummary",
  "bibliography",
  "cssclass",
  "currentmodule",
  "dropdown",
  "footbibliography",
  "glossary",
  "graphviz",
  "grid",
  "highlight",
  "minigallery",
  "rst-class",
  "tab-set",
  "tabularcolumns",
  "toctree",
  "towncrier-draft-entries",
]
ignore_messages = "^.*(Unknown target name|Undefined substitution referenced)[^`]*$"
ignore_roles = [
  "attr",
  "class",
  "doc",
  "eq",
  "exc",
  "file",
  "footcite",
  "footcite:t",
  "func",
  "gh",
  "kbd",
  "meth",
  "mod",
  "newcontrib",
  "pr",
  "py:mod",
  "ref",
  "samp",
  "term",
]
report_level = "WARNING"

[tool.ruff]
extend-exclude = ["benchmarks", "doc", "setup.py"]
line-length = 88

[tool.ruff.lint]
ignore = [
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D413",  # Missing blank line after last section
]
select = ["A", "B006", "D", "E", "F", "I", "UP", "UP031", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["D205"]
"mne_connectivity/base.py" = ["D101", "D102", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = [
  "mne.utils.copy_doc",
  "mne.utils.copy_function_doc_to_method_doc",
  "mne.utils.deprecated",
  "property",
  "setter",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["mne_connectivity*tests"]
include = ["mne_connectivity*"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"

[tool.tomlsort]
all = true
ignore_case = true
spaces_before_inline_comment = 2
trailing_comma_inline_array = true

[tool.towncrier]
directory = "doc/changes/dev/"
filename = "doc/changes/dev.rst"
issue_format = "`#{issue} <https://github.com/mne-tools/mne-connectivity/pull/{issue}>`__"
package = "mne-connectivity"
title_format = "{version} ({project_date})"

[[tool.towncrier.type]]
directory = "notable"
name = "Notable changes"
showcontent = true

[[tool.towncrier.type]]
directory = "dependency"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "apichange"
name = "API changes by deprecation"
showcontent = true

[[tool.towncrier.type]]
directory = "newfeature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "other"
name = "Other changes"
showcontent = true
