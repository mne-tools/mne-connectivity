repos:
  # Ruff mne-connectivity
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        name: ruff lint mne-connectivity
        args: ["--fix"]
        files: ^mne_connectivity/|^tools/
      - id: ruff-check
        name: ruff lint mne-connectivity preview
        args: ["--fix", "--preview", "--select=NPY201"]
        files: ^mne_connectivity/|^tools/
      - id: ruff-check
        name: ruff lint doc and examples
        # D103: missing docstring in public function
        # D400: docstring first line must end with period
        args: ["--ignore=D103,D400", "--fix"]
        files: ^doc/|^examples/
      - id: ruff-format
        files: ^mne_connectivity/|^doc/|^examples/|^tools/

  # Codespell
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        files: ^mne_connectivity/|^doc/|^examples/|^tools/
        types_or: [python, bib, rst, inc]

  # yamllint
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]

  # rstcheck
  - repo: https://github.com/rstcheck/rstcheck.git
    rev: v6.3.0
    hooks:
      - id: rstcheck
        additional_dependencies:
          - tomli
        files: ^doc/.*\.(rst|inc)$

  # file-contents-sorter
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: file-contents-sorter
        files: ^doc/changes/names.inc
        args: ["--ignore-case"]

  # toml-sort
  - repo: https://github.com/pappasam/toml-sort.git
    rev: v0.25.0
    hooks:
      - id: toml-sort-fix
        files: pyproject.toml

ci:
  autofix_prs: true
