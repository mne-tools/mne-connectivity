name: autofix.ci

on:  # yamllint disable-line rule:truthy
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix-changelog:
    name: Rename towncrier files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Rename towncrier files
        uses: mne-tools/mne-tools/actions/rename-towncrier@main
        with:
          project-root: ${{ github.workspace }}
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        if: success() || failure()
  changed-files:
    name: Check for dependency-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dependencies: ${{ steps.check.outputs.dependencies }}
    steps:
      - name: Check whether any dependency input or generated file changed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          # Also match the generated files themselves, so hand-edits get reverted
          PATTERN='^(pyproject\.toml|environment\.yml|README\.rst|\.github/workflows/autofix\.yml)$'
          # Collect first: `grep -q` exits early, and the resulting SIGPIPE would
          # trip `pipefail` precisely when a file does match
          FILES=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if grep -qE "$PATTERN" <<< "$FILES"; then
            echo "dependencies=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "dependencies=false" | tee -a "$GITHUB_OUTPUT"
          fi
  autofix-dependencies:
    name: Autoupdate README dependencies
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.dependencies == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Sync dependencies to README
        uses: mne-tools/mne-tools/actions/sync-dependencies-to-readme@main
        with:
          project-root: ${{ github.workspace }}
      - name: Sync dependencies to environment.yml
        uses: tsbinns/mne-tools/actions/sync-dependencies-to-environment-file@fix-env-sync
        with:
          project-root: ${{ github.workspace }}
          extras: gui
          # hdf5<2.2 due to incompatibility with h5py 3.16.0 (gh-449)
          additional-dependencies: pip,joblib,statsmodels,h5io,pillow,hdf5<2.2.0,PySide6==6.11.1
          requirements-overrides: mne->mne-base,vtk==9.6.2
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        if: success() || failure()
