name: 'linux / conda'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  # Linux
  job:
    timeout-minutes: 20
    name: 'py3.13'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      MNE_LOGGING_LEVEL: 'warning'
      PYTHONUNBUFFERED: '1'
      PYTHON_VERSION: '3.13'
      PYTEST_XDIST_N: '4'  # ubuntu runners have 4 cores
    steps:
      - uses: actions/checkout@v7
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: >- # beware the >- instead of |, we don't split on newlines but on spaces
            python=${{ env.PYTHON_VERSION }}
      - run: |
          curl https://raw.githubusercontent.com/mne-tools/mne-python/main/tools/get_minimal_commands.sh -o get_minimal_commands.sh
          chmod +x get_minimal_commands.sh
          source ./get_minimal_commands.sh
          pip install .[test]
        name: 'Install dependencies'
      - run: pip install git+https://github.com/mne-tools/mne-python@main
      - run: pip install -e .
      - name: 'Clone MNE-Python'
        uses: actions/checkout@v7
        with:
          repository: mne-tools/mne-python
          path: mne-python
      - name: 'Get testing data version'
        run: ./tools/get_testing_version.sh
        working-directory: mne-python
      - name: 'Cache testing data'
        uses: actions/cache@v6
        with:
          key: testing_data-${{ env.TESTING_VERSION }}
          path: ~/mne_data
      - run: python -c "import mne; print(mne.datasets.testing.data_path(verbose=True))"
      - run: |
          which mne
          mne sys_info -pd
          python -c "import numpy; numpy.show_config()"
        name: 'Show infos'
      - name: Run pytest
        run: python -m pytest . -n "$PYTEST_XDIST_N" --timeout=180 --timeout-method=thread --cov=mne_connectivity --cov-report=xml --cov-config=pyproject.toml --verbose --ignore mne-python
      - uses: codecov/codecov-action@v7
        if: success() || failure()
        with:
          token: 6364d4ef-0267-4ae6-b844-ee4333be8701
